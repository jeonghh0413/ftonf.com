<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ft.onf - Running Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        .logo { margin-bottom: 0.5rem; }
        .logo img { width: min(320px, 70vw); height: auto; display: block; margin: 0 auto; }
        .tagline { font-size: 1.2rem; color: #888; margin-bottom: 2rem; }
        .stores { display: flex; gap: 0.5rem; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 2rem; }
        .stores a { display: inline-block; transition: transform 0.2s, opacity 0.2s; }
        .stores a:hover { transform: translateY(-2px); opacity: 0.85; }
        .stores img { display: block; }
        .stores .apple { height: 64px; }
        .stores .google { height: 73px; margin: -8px 0; }
        .links { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
        .links a {
            color: #6C63FF;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border: 1px solid #333;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .links a:hover { background: #6C63FF; color: #fff; }
        footer {
            position: fixed;
            bottom: 2rem;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><img src="assets/logo.png" alt="ft.onf"></div>
        <p class="tagline">Your Running Companion</p>
        <div class="stores">
            <a href="https://apps.apple.com/kr/app/ftonf/id6756258391" target="_blank" rel="noopener" aria-label="App Store에서 다운로드">
                <img class="apple" src="https://toolbox.marketingtools.apple.com/api/badges/download-on-the-app-store/black/ko-kr?size=250x83" alt="App Store에서 다운로드">
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.mycompany.ftonf" target="_blank" rel="noopener" aria-label="Google Play에서 다운로드">
                <img class="google" src="https://play.google.com/intl/ko/badges/static/images/badges/ko_badge_web_generic.png" alt="Google Play에서 다운로드">
            </a>
        </div>
        <div class="links">
            <a href="/privacy">Privacy Policy</a>
            <a href="mailto:jeonghh0413@gmail.com">Contact</a>
        </div>
    </div>
    <footer>&copy; 2026 ft.onf. All rights reserved.</footer>
</body>
</html>
